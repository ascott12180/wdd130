<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="A recipe website featuring easy and delicious meals.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Find and share delicious recipes.">
    <meta property="og:url" content="https://yourwebsite.com">
    <meta property="og:image" content="https://yourwebsite.com/images/social-preview-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Find and share delicious recipes.">
    <meta name="twitter:image" content="https://yourwebsite.com/images/social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <title>Recipe book</title>
    <script src="script.js" defer></script>
</head>
<body>
    
  <header>
    <img src="logo.png" alt="cook book with chef hat">
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Find a recipe">
    <button onclick="performSearch()">🔍</button>
  </div>

  <!-- THIS IS REQUIRED -->
  <main id="recipeContainer"></main>

  <div class="social">
    <a href="#"><img src="instagram_icon.png" alt="instagram"></a>
    <a href="#"><img src="youtube_icon.png" alt="youtube"></a>
    <a href="#"><img src="pinterest_icon.png" alt="pinterest"></a>
  </div>

  <footer>
    <a href="https://www.flaticon.com/free-icons/recipe">
      Recipe icons by Freepik - Flaticon
    </a>
  </footer>
</body>
