<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Form</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="ticketform">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type" required>
          <option value="">Choose one</option>
          <option value="one">Student</option>
          <option value="two">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="date">Event Date</label>
        <input id="date" name="date" type="date" required />
      </div>

      <div id="access" class="field full">
        <label for="code">Access Code</label>
        <input id="code" name="code" type="text" />
      </div>

      <div id="studentField" class="field full">
        <label for="student">Student |#</label>
        <input id="student" name="student" type="text" />
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <section id="output" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
