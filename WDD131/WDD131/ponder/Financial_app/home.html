<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetWise Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<main class="dashboard">

    
    <aside class="sidebar">

        <img src="budget logo.png" alt="BudgetWise Logo" class="logo">

        <nav>
            <a href="home.html" class="active">🏠 Home</a>
            <a href="transactions.html">💳 Transactions</a>
        </nav>

    </aside>

    
    <section class="content">

        
        <header class="top-header">
            <div>
                <h1>Good Morning!</h1>
                <p>Welcome back to BudgetWise.</p>
            </div>
        </header>

        
        <section class="summary-cards">

            <div class="card balance">
                <h3>Current Balance</h3>
                <h2 id="balance">$0.00</h2>
            </div>

            <div class="card income">
                <h3>Income</h3>
                <h2 id="income">$0.00</h2>
            </div>

            <div class="card expenses">
                <h3>Expenses</h3>
                <h2 id="expenses">$0.00</h2>
            </div>

        </section>

    
        <section class="add-transaction">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Transaction Name"
                    required
                >

                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    step="0.01"
                    required
                >

                <select id="type">

                    <option value="income">Income</option>
                    <option value="expense">Expense</option>

                </select>

                <select id="category">

                    <option value="Salary">Salary</option>
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Other">Other</option>

                </select>

                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </section>

        
        <section class="transactions">

            <div class="section-header">
                <h2>Recent Transactions</h2>
            </div>

            <table>

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>

                    </tr>

                </thead>

                <tbody id="transactionList">

                </tbody>

            </table>

        </section>

        
        <section class="bottom">
        
            <div class="savings card">

                <h2>Savings Goal</h2>

                <h3 id="goalText">$0.00 / $5000.00</h3>

                <div class="progress">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <p id="progressPercent">0%</p>

                <hr>

                <h4>Set New Goal</h4>

                <input
                    type="number"
                    id="goalInput"
                    placeholder="Enter Savings Goal"
                    min="1"
                >

                <button id="saveGoal">
                    Save Goal
                </button>

            </div>
                <ul id="categoryTotals">

                </ul>


        </section>

    </section>

</main>



</body>
</html>
