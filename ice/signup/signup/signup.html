<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            justify-content: center;
            display: flex;
        }
        #formContainer{
           background-color: #ffffff;
            border-radius: 30px;
            border-color: rgb(68, 7, 211);
            border-style: solid;
            
            position: relative;
            width: 500px;
            display: flex;
            flex-direction: column;
        
            text-align: center;
            overflow: hidden;
        }
        .jesus{
            width: 100%;
            height: 300px;
        }
        #head{
            position: relative;
        }

        .overlay-text{
            position: absolute;
            top: 40%;
            left: 30%;
            color: white;
            text-align: center;
            text-shadow: 2px 2px 6px black;
        }

        .overlay-text h4{
            font-size: 50px;
        }

        .overlay-text h5{
            font-size: 24px;
        }
                
       
        #closeBtn{
            position: absolute;
            top:10px;
            left:10px
        }
        #myForm{
            display: grid ;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 30px;
            align-items: center;

        }
        label{
            grid-column: 1/2;
        }
        section{
            grid-column: 1/3;
        }
        .scripture-row{
          
        display: flex;
        }

        .scripture-row img{
        width: 100%;            
        height: 100px;
        object-fit: cover;
        padding: 5px;
        }
        
        
        
    </style>




</head>

<body>
    

    <div id="formContainer">

        <div id="head">
            <img class="jesus" src= "images/jesus_feeds_5000.jpeg" alt="jesus">
            <div class = 'overlay-text'>
            <h4>Daily Feed </h4>
            <h5>Scripture a Day</h5>
            </div>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        <div class="scripture-row">
            <img class= "scriptures" src="images/old_testament.webp" alt="OT">
            <img class= "scriptures" src="images/new_testament.webp" alt="NT">
            <img class= "scriptures" src="images/book_of_mormon.webp" alt="BoM">
            <img class= "scriptures" src="images/doctrine_and_covenants.webp" alt="DC">
            <img class= "scriptures" src="images/pearl_of_great_price.webp" alt="PoGP">
        </div>
        </form>
        
        
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
